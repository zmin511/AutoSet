<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zmin_autoset</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101214;
      --panel: #181c20;
      --line: #30363d;
      --text: #eef2f5;
      --muted: #9aa7b2;
      --accent: #37c58f;
      --bad: #ef6b73;
      --soft: #20262b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Segoe UI, Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main { width: min(1280px, calc(100vw - 32px)); margin: 0 auto; padding: 22px 0 38px; }
    header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; margin-bottom: 16px; }
    h1 { font-size: 28px; line-height: 1.1; margin: 0; font-weight: 720; }
    .paths { color: var(--muted); font-size: 12px; text-align: right; line-height: 1.45; }
    .grid { display: grid; grid-template-columns: minmax(560px, 1.2fr) minmax(380px, .8fr); gap: 18px; align-items: start; }
    section { border-top: 1px solid var(--line); padding-top: 14px; }
    label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 7px; }
    input, select, button {
      font: inherit;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #0d0f11;
      color: var(--text);
    }
    input, select { width: 100%; padding: 10px 11px; }
    button { padding: 9px 12px; cursor: pointer; }
    button.primary { background: var(--accent); color: #07110d; border-color: var(--accent); font-weight: 700; }
    button:disabled { opacity: .45; cursor: default; }
    .toolbar { display: grid; grid-template-columns: 1fr 92px 120px; gap: 8px; margin-bottom: 10px; }
    .crumbs { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; margin: 7px 0 10px; color: var(--muted); font-size: 13px; }
    .crumbs button { padding: 5px 8px; font-size: 13px; }
    .browser {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      max-height: 68vh;
      overflow-y: auto;
      background: var(--panel);
    }
    .item {
      width: 100%;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 104px 62px 66px 58px;
      gap: 8px;
      align-items: center;
      padding: 9px 11px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .item:hover, .item.selected { background: var(--soft); }
    .folder { color: #d7e9ff; font-weight: 680; }
    .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title {
      min-width: 0;
      overflow: hidden;
    }
    .title .name {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      white-space: normal;
      line-height: 1.25;
      font-size: 15px;
    }
    .sub { display: block; color: var(--muted); font-size: 11px; line-height: 1.25; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cell { color: #dbe7ee; font-size: 12px; white-space: normal; overflow-wrap: anywhere; text-align: right; justify-self: end; }
    .genre-cell { font-size: 11px; line-height: 1.2; color: #f0f5f8; }
    .tag { border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; text-align: center; min-width: 58px; }
    .head {
      position: sticky;
      top: 0;
      z-index: 2;
      background: #15191d;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0;
      cursor: default;
    }
    .head:hover { background: #15191d; }
    .sort-head {
      justify-self: end;
      color: var(--muted);
      font-size: 11px;
      border: 0;
      background: transparent;
      padding: 0;
      text-transform: uppercase;
    }
    .sort-head.active { color: var(--accent); }
    .play {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 999px;
      text-align: center;
      color: var(--text);
    }
    .play.active { background: var(--accent); color: #07110d; border-color: var(--accent); }
    .selected-box, pre {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
    }
    .selected-box {
      min-height: 62px;
      color: #c8f6df;
      margin-bottom: 8px;
      border-color: rgba(55, 197, 143, .45);
      background: rgba(55, 197, 143, .08);
    }
    .selected-box strong { color: #e7fff4; font-size: 14px; }
    .selected-meta {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 5px;
      font-size: 12px;
    }
    .genre-select {
      width: auto;
      max-width: 150px;
      padding: 3px 22px 3px 7px;
      font-size: 12px;
      color: #e7fff4;
      border-color: rgba(55, 197, 143, .45);
      background-color: #102019;
    }
    .style-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 10px;
      margin-bottom: 8px;
      max-height: 315px;
      overflow-y: auto;
    }
    .style-group { margin-bottom: 6px; }
    .style-group:last-child { margin-bottom: 0; }
    .style-title { color: var(--muted); font-size: 10px; margin: 0 0 3px; }
    .style-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }
    .style-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 5px;
      font-size: 10px;
      color: var(--text);
      background: #0d0f11;
      cursor: pointer;
      user-select: none;
    }
    .style-chip input { width: auto; margin: 0; }
    audio { width: 100%; margin: 0 0 13px; }
    .controls { display: grid; grid-template-columns: 1fr 110px 110px 110px; gap: 9px; margin-bottom: 12px; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .maintenance { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
    .maintenance label { font-size: 12px; }
    .maintenance .buttons { margin-bottom: 0; }
    pre {
      min-height: 150px;
      max-height: 30vh;
      overflow: auto;
      white-space: pre-wrap;
      color: #dce7ed;
      font-size: 12px;
      line-height: 1.35;
    }
    .status { color: var(--muted); font-size: 13px; margin: 8px 0 0; min-height: 18px; }
    .ok { color: var(--accent); }
    .bad { color: var(--bad); }
    .hint { color: var(--muted); font-size: 13px; line-height: 1.55; margin-top: 11px; }
    .key-1, .key-6, .key-11 { background: rgba(55, 197, 143, .16); border-color: rgba(55, 197, 143, .42); }
    .key-2, .key-7, .key-12 { background: rgba(73, 150, 236, .16); border-color: rgba(73, 150, 236, .42); }
    .key-3, .key-8 { background: rgba(236, 196, 76, .16); border-color: rgba(236, 196, 76, .42); }
    .key-4, .key-9 { background: rgba(236, 116, 87, .16); border-color: rgba(236, 116, 87, .42); }
    .key-5, .key-10 { background: rgba(189, 125, 235, .16); border-color: rgba(189, 125, 235, .42); }
    .genre-house { border-left: 4px solid #37c58f; }
    .genre-techno { border-left: 4px solid #bd7deb; }
    .genre-dance { border-left: 4px solid #49a0ec; }
    .genre-dnb { border-left: 4px solid #ef6b73; }
    .genre-trance { border-left: 4px solid #ecc44c; }
    .genre-pop { border-left: 4px solid #ec8ed0; }
    .genre-rock { border-left: 4px solid #a6b0ba; }
    @media (max-width: 980px) {
      main { width: min(100vw - 20px, 1280px); padding-top: 16px; }
      header, .grid { display: block; }
      .paths { text-align: left; margin-top: 10px; }
      .toolbar, .controls { grid-template-columns: 1fr; }
      .browser { max-height: 48vh; margin-bottom: 18px; }
      .item { grid-template-columns: 38px minmax(0, 1fr) 64px 50px 56px; }
      .item .cell:nth-child(6) { display: none; }
      .title .name { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>zmin_autoset</h1>
        <div class="status" id="status">Загрузка библиотеки...</div>
      </div>
      <div class="paths" id="paths"></div>
    </header>

    <div class="grid">
      <section>
        <div class="toolbar">
          <input id="search" placeholder="Поиск или оставь пустым для просмотра папки">
          <select id="limit">
            <option>20</option>
            <option selected>40</option>
            <option>60</option>
            <option>80</option>
            <option>100</option>
            <option>120</option>
            <option>140</option>
            <option>160</option>
            <option>180</option>
            <option>200</option>
          </select>
          <button id="clearSearch">Папки</button>
        </div>
        <div class="crumbs" id="crumbs"></div>
        <div class="browser" id="browser"></div>
        <div class="maintenance">
          <label>Обслуживание текущей папки</label>
          <div class="buttons">
            <button id="refreshTags">Обновить теги в папке</button>
            <button id="reloadFolder">Обновить список</button>
          </div>
        </div>
      </section>

      <section>
        <div class="selected-box" id="selected">Выбери трек из папки или поиска.</div>
        <div class="style-box">
          <label>Стили для подбора</label>
          <div class="style-grid" id="styleGrid"></div>
        </div>
        <audio id="player" controls preload="none"></audio>

        <div class="controls">
          <div>
            <label for="role">Роль трека</label>
            <select id="role">
              <option value="start">Начало</option>
              <option value="peak">Кульминация</option>
            </select>
          </div>
          <div>
            <label for="minutes">Длительность</label>
            <input id="minutes" type="number" min="15" max="360" step="5" value="90">
          </div>
          <div>
            <label for="keyStep">Camelot ±</label>
            <input id="keyStep" type="number" min="0" max="12" step="1" value="5">
          </div>
          <div>
            <label for="bpmWindow">BPM ±</label>
            <input id="bpmWindow" type="number" min="0" max="80" step="1" value="5">
          </div>
        </div>

        <div class="buttons">
          <button class="primary" id="build" disabled>Создать сет</button>
        </div>

        <pre id="output">Готовый сет появится в папке Music/Sets на этом SSD.</pre>
        <div class="hint">BPM, Camelot, жанр и битрейт берутся из Engine DJ, а если трека нет в базе, приложение пытается показать то, что уже записано в файл.</div>
      </section>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let selectedTrack = null;
    let currentPath = '';
    let timer = null;
    let playingPath = '';
    let styleGroups = [];
    let genreOptions = [];
    let currentRows = { dirs: [], tracks: [], rel: '', parent: '' };
    let sortState = { key: '', dir: 'asc' };

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function fmtLen(seconds) {
      const m = Math.floor((seconds || 0) / 60);
      const s = String((seconds || 0) % 60).padStart(2, '0');
      return seconds ? `${m}:${s}` : '';
    }

    function metaLine(track) {
      return `${track.genre || 'genre?'} · ${track.bpm || '?'} BPM · ${track.camelot || 'key?'} · ${fmtLen(track.length) || 'len?'}`;
    }

    function keyClass(camelot) {
      const m = String(camelot || '').match(/^(\d{1,2})[AB]$/i);
      return m ? `key-${m[1]}` : '';
    }

    function camelotSortValue(camelot) {
      const m = String(camelot || '').match(/^(\d{1,2})([AB])$/i);
      if (!m) return 999;
      return Number(m[1]) * 2 + (m[2].toUpperCase() === 'B' ? 1 : 0);
    }

    function genreClass(genre) {
      const g = String(genre || '').toLowerCase();
      if (g.includes('house')) return 'genre-house';
      if (g.includes('techno')) return 'genre-techno';
      if (g.includes('dnb') || g.includes('drum')) return 'genre-dnb';
      if (g.includes('trance')) return 'genre-trance';
      if (g.includes('dance') || g.includes('electronic')) return 'genre-dance';
      if (g.includes('rock')) return 'genre-rock';
      if (g.includes('pop')) return 'genre-pop';
      return '';
    }

    function normStyle(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/[^a-zа-я0-9]+/gi, '_')
        .replace(/_+/g, '_')
        .replace(/^_|_$/g, '')
        .replace(/^breakbeat$/, 'break_beat')
        .replace(/^funky$/, 'funky_house')
        .replace(/^groove$/, 'funky_house')
        .replace(/^jackin$/, 'jackin_house')
        .replace(/^deep_tech$/, 'minimal_deep_tech')
        .replace(/^soul_funk$/, 'soul_and_funk');
    }

    async function loadStyles() {
      const [styleRes, genreRes] = await Promise.all([fetch('/api/styles'), fetch('/api/genres')]);
      const data = await styleRes.json();
      const genreData = await genreRes.json();
      styleGroups = data.groups || [];
      genreOptions = genreData.genres || [];
      renderStyleGrid();
    }

    function genreSelect(track) {
      const current = track.genre || '';
      const options = Array.from(new Set([current, ...genreOptions].filter(Boolean)));
      return `<select class="genre-select" id="selectedGenre">
        ${options.map(g => `<option value="${esc(g)}" ${g === current ? 'selected' : ''}>${esc(g)}</option>`).join('')}
      </select>`;
    }

    function selectedMarkup(track, withStatus = true) {
      return `
        <strong>${esc(track.label || track.filename)}</strong>
        <div class="selected-meta">
          ${genreSelect(track)}
          <span>${esc(track.camelot || 'key?')}</span>
          <span>${esc(track.bpm || '?')} BPM</span>
          <span>${fmtLen(track.length) || 'len?'}</span>
          <span>${esc(track.bitrate || '')} kbps</span>
        </div>
        ${withStatus ? `<div class="selected-meta"><span>${track.id ? 'Можно строить сет' : 'Нет в Engine DB: сначала импортируй/проанализируй трек в Engine'}</span></div>` : ''}
      `;
    }

    function wireGenreSelect() {
      const select = $('selectedGenre');
      if (!select || !selectedTrack?.id) return;
      select.addEventListener('change', async () => {
        const genre = select.value;
        $('status').textContent = 'Сохраняю жанр...';
        try {
          const res = await fetch('/api/update-genre', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ track_id: selectedTrack.id, genre })
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || 'update failed');
          selectedTrack.genre = genre;
          applyInferredStyles(selectedTrack);
          $('status').className = 'status ok';
          $('status').textContent = 'Жанр сохранён';
          if ($('search').value.trim()) search(); else browse(currentPath);
        } catch (err) {
          $('status').className = 'status bad';
          $('status').textContent = `Ошибка сохранения жанра: ${err}`;
        }
      });
    }

    function renderStyleGrid() {
      const box = $('styleGrid');
      box.innerHTML = styleGroups.map(group => `
        <div class="style-group">
          <div class="style-title">${esc(group.name)}</div>
          <div class="style-grid">
            ${(group.styles || []).map(style => `
              <label class="style-chip" title="${esc(style.count || 0)} tracks">
                <input type="checkbox" value="${esc(style.value)}">
                <span>${esc(style.label)}</span>
              </label>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function inferStyles(track) {
      const text = `${track.genre || ''} ${track.label || ''} ${track.filename || ''}`.toLowerCase();
      const genreParts = String(track.genre || '').split(/[,;/|<>]+/).map(normStyle).filter(Boolean);
      const picked = new Set();
      genreParts.forEach(v => picked.add(v));
      if (text.includes('tech house')) picked.add('tech_house');
      if (text.includes('deep house')) picked.add('deep_house');
      if (text.includes('disco house') || text.includes('disco')) picked.add('disco_house');
      if (text.includes('progressive')) picked.add('progressive_house');
      if (text.includes('melodic') || text.includes('organic')) picked.add('melodic_house');
      if (text.includes('house')) picked.add('house');
      if (text.includes('melodic techno')) picked.add('melodic_techno');
      if (text.includes('techno') || text.includes('boris brejcha')) picked.add('techno');
      if (text.includes('trance')) picked.add('trance');
      if (text.includes('drum') || text.includes('dnb')) picked.add('dnb');
      if (text.includes('breakbeat') || text.includes('break beat')) picked.add('break_beat');
      if (text.includes('garage')) picked.add('uk_garage');
      if (text.includes('electronic') || text.includes('electronics') || text.includes('electronica')) {
        picked.add('electronic');
        picked.add('electronics');
        picked.add('electronica');
      }
      if (text.includes('dance') || text.includes('edm')) picked.add('dance');
      if (text.includes('pop')) picked.add('pop');
      if (text.includes('rock')) picked.add('rock');
      if (picked.has('house')) {
        ['tech_house', 'deep_house', 'disco_house', 'progressive_house', 'afro_house', 'funky_house', 'club_house', 'chill_house', 'jackin_house'].forEach(v => picked.add(v));
      }
      if (picked.has('electronic') || picked.has('electronics') || picked.has('electronica')) {
        ['electronic', 'electronics', 'electronica', 'dance', 'indie_dance', 'nu_disco'].forEach(v => picked.add(v));
      }
      return picked;
    }

    function applyInferredStyles(track) {
      const picked = inferStyles(track);
      document.querySelectorAll('#styleGrid input[type="checkbox"]').forEach(input => {
        input.checked = picked.has(input.value);
      });
    }

    function selectedStyles() {
      return Array.from(document.querySelectorAll('#styleGrid input[type="checkbox"]:checked')).map(input => input.value);
    }

    function trackRow(track) {
      const btn = document.createElement('div');
      btn.tabIndex = 0;
      btn.className = `item ${genreClass(track.genre)}` + (selectedTrack?.id && selectedTrack.id === track.id ? ' selected' : '');
      btn.innerHTML = `
        <button class="play ${playingPath === (track.rel || track.path) ? 'active' : ''}" title="Прослушать">▶</button>
        <div class="title"><span class="name">${esc(track.label || track.filename)}</span><span class="sub">${esc(track.path || track.rel || '')}</span></div>
        <div class="cell genre-cell">${esc(track.genre || '')}</div>
        <div class="cell tag ${keyClass(track.camelot)}">${esc(track.camelot || '')}</div>
        <div class="cell tag">${esc(track.bpm || '')}</div>
        <div class="cell">${esc(fmtLen(track.length))}</div>
      `;
      btn.onclick = (event) => {
        if (event.target.classList.contains('play')) {
          event.stopPropagation();
          playTrack(track);
        } else {
          selectTrack(track);
        }
      };
      return btn;
    }

    function renderHeader(box) {
      const head = document.createElement('div');
      head.className = 'item head';
      head.innerHTML = `
        <div></div>
        <div>Название / путь</div>
        <button class="sort-head ${sortState.key === 'genre' ? 'active' : ''}" data-sort="genre">Жанр ${sortState.key === 'genre' ? (sortState.dir === 'asc' ? '↑' : '↓') : ''}</button>
        <button class="sort-head ${sortState.key === 'camelot' ? 'active' : ''}" data-sort="camelot">Key ${sortState.key === 'camelot' ? (sortState.dir === 'asc' ? '↑' : '↓') : ''}</button>
        <button class="sort-head ${sortState.key === 'bpm' ? 'active' : ''}" data-sort="bpm">BPM ${sortState.key === 'bpm' ? (sortState.dir === 'asc' ? '↑' : '↓') : ''}</button>
        <button class="sort-head ${sortState.key === 'length' ? 'active' : ''}" data-sort="length">Длит. ${sortState.key === 'length' ? (sortState.dir === 'asc' ? '↑' : '↓') : ''}</button>
      `;
      head.querySelectorAll('[data-sort]').forEach(btn => {
        btn.onclick = (event) => {
          event.stopPropagation();
          setSort(btn.dataset.sort);
        };
      });
      box.appendChild(head);
    }

    function sortedTracks(tracks) {
      const out = [...tracks];
      if (!sortState.key) return out;
      const dir = sortState.dir === 'asc' ? 1 : -1;
      out.sort((a, b) => {
        let av;
        let bv;
        if (sortState.key === 'bpm') {
          av = Number(a.bpm || 0);
          bv = Number(b.bpm || 0);
        } else if (sortState.key === 'length') {
          av = Number(a.length || 0);
          bv = Number(b.length || 0);
        } else if (sortState.key === 'camelot') {
          av = camelotSortValue(a.camelot);
          bv = camelotSortValue(b.camelot);
        } else {
          av = String(a.genre || '').toLowerCase();
          bv = String(b.genre || '').toLowerCase();
        }
        if (av < bv) return -1 * dir;
        if (av > bv) return 1 * dir;
        return String(a.label || '').localeCompare(String(b.label || ''), 'ru');
      });
      return out;
    }

    function setSort(key) {
      if (sortState.key === key) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState.key = key;
        sortState.dir = 'asc';
      }
      renderRows();
    }

    function renderRows() {
      renderCrumbs(currentRows.rel || '');
      const box = $('browser');
      box.innerHTML = '';
      renderHeader(box);
      if ((currentRows.rel || '') && currentRows.parent !== undefined) {
        const up = document.createElement('button');
        up.className = 'item';
        up.innerHTML = '<div></div><div class="folder">..</div><div></div><div></div><div></div><div></div>';
        up.onclick = () => browse(currentRows.parent || '');
        box.appendChild(up);
      }
      currentRows.dirs.forEach(dir => {
        const btn = document.createElement('button');
        btn.className = 'item';
        btn.innerHTML = `<div></div><div class="folder">${esc(dir.name)}</div><div></div><div></div><div>Папка</div><div></div>`;
        btn.onclick = () => browse(dir.rel);
        box.appendChild(btn);
      });
      sortedTracks(currentRows.tracks || []).forEach(track => box.appendChild(trackRow(track)));
    }

    function renderCrumbs(rel) {
      const box = $('crumbs');
      box.innerHTML = '';
      const root = document.createElement('button');
      root.textContent = 'Music';
      root.onclick = () => browse('');
      box.appendChild(root);
      let acc = '';
      rel.split('/').filter(Boolean).forEach(part => {
        const sep = document.createElement('span');
        sep.textContent = '/';
        box.appendChild(sep);
        acc = acc ? `${acc}/${part}` : part;
        const b = document.createElement('button');
        b.textContent = part;
        b.onclick = () => browse(acc);
        box.appendChild(b);
      });
    }

    async function loadConfig() {
      const res = await fetch('/api/config');
      const cfg = await res.json();
      const provider = cfg.library_provider || {};
      const detected = (cfg.library_candidates || []).filter(item => item.status === 'detected_not_supported').length;
      const extra = detected ? `<br>Detected other libraries: ${detected}` : '';
      $('paths').innerHTML = `${esc(cfg.app_name || 'zmin_autoset')} · v${esc(cfg.version || '0.2.0')}<br>Library: ${esc(provider.name || 'Denon Engine DJ')} · ${esc(provider.status || '')}<br>Music: ${esc(cfg.music_root)}<br>Sets: ${esc(cfg.sets_dir)}<br>DB: ${esc(cfg.db_path)}${extra}`;
      $('status').className = cfg.ready ? 'status ok' : 'status bad';
      $('status').textContent = cfg.ready ? `Готово · ${cfg.startup_refresh || ''}` : 'Не найдена база или builder';
    }

    async function browse(rel = currentPath) {
      currentPath = rel || '';
      $('search').value = '';
      $('status').className = 'status';
      $('status').textContent = 'Открываю папку...';
      const res = await fetch(`/api/browse?path=${encodeURIComponent(currentPath)}`);
      const data = await res.json();
      if (data.error) {
        $('status').className = 'status bad';
        $('status').textContent = data.error;
        return;
      }
      currentPath = data.rel || '';
      currentRows = data;
      renderRows();
      $('status').textContent = `Папок: ${data.dirs.length}, треков: ${data.tracks.length}`;
    }

    async function search() {
      const q = $('search').value.trim();
      if (!q) {
        browse(currentPath);
        return;
      }
      $('status').className = 'status';
      $('status').textContent = 'Поиск...';
      const res = await fetch(`/api/search?q=${encodeURIComponent(q)}&limit=${$('limit').value}`);
      const data = await res.json();
      $('crumbs').innerHTML = `<span>Поиск: ${esc(q)}</span>`;
      currentRows = { rel: '', parent: '', dirs: [], tracks: data.tracks || [] };
      renderRows();
      $('status').textContent = `Найдено: ${data.tracks.length}`;
    }

    function selectTrack(track) {
      selectedTrack = track;
      $('build').disabled = !track.id;
      applyInferredStyles(track);
      $('selected').innerHTML = selectedMarkup(track);
      wireGenreSelect();
      if ($('search').value.trim()) search(); else browse(currentPath);
    }

    function playTrack(track) {
      const mediaPath = track.rel || track.path;
      if (!mediaPath) return;
      playingPath = mediaPath;
      const player = $('player');
      const src = `/media?path=${encodeURIComponent(mediaPath)}`;
      if (player.getAttribute('src') !== src) {
        player.setAttribute('src', src);
      }
      player.play().catch(() => {});
      selectedTrack = track;
      applyInferredStyles(track);
      $('selected').innerHTML = selectedMarkup(track, false);
      wireGenreSelect();
      $('build').disabled = !track.id;
      if ($('search').value.trim()) search(); else browse(currentPath);
    }

    async function build() {
      if (!selectedTrack?.id) return;
      $('build').disabled = true;
      $('output').textContent = 'Создаю сет...';
      $('status').className = 'status';
      $('status').textContent = 'Копирую треки и пишу плейлисты...';
      try {
        const res = await fetch('/api/build', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            track_id: selectedTrack.id,
            role: $('role').value,
            minutes: Number($('minutes').value),
            max_key_step: Number($('keyStep').value),
            bpm_window: Number($('bpmWindow').value),
            style_filter: selectedStyles()
          })
        });
        const data = await res.json();
        $('output').textContent = data.output || data.error || 'Нет вывода.';
        $('status').className = data.ok ? 'status ok' : 'status bad';
        $('status').textContent = data.ok ? `Сет создан: ${data.set_folder}` : 'Сборка завершилась с ошибкой';
      } catch (err) {
        $('output').textContent = String(err);
        $('status').className = 'status bad';
        $('status').textContent = 'Ошибка запуска';
      } finally {
        $('build').disabled = false;
      }
    }

    async function refreshTags() {
      $('refreshTags').disabled = true;
      $('output').textContent = 'Обновляю BPM, Camelot и битрейт из Engine DB для текущей папки...';
      try {
        const res = await fetch('/api/refresh-tags', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ path: currentPath })
        });
        const data = await res.json();
        $('output').textContent = data.output || data.error || 'Нет вывода.';
        $('status').className = data.ok ? 'status ok' : 'status bad';
        $('status').textContent = data.ok ? 'Теги обновлены' : 'Не удалось обновить теги';
        await browse(currentPath);
      } catch (err) {
        $('output').textContent = String(err);
        $('status').className = 'status bad';
        $('status').textContent = 'Ошибка обновления';
      } finally {
        $('refreshTags').disabled = false;
      }
    }

    $('search').addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(search, 220);
    });
    $('limit').addEventListener('change', search);
    $('clearSearch').addEventListener('click', () => browse(currentPath));
    $('reloadFolder').addEventListener('click', () => browse(currentPath));
    $('refreshTags').addEventListener('click', refreshTags);
    $('build').addEventListener('click', build);
    loadStyles().then(() => loadConfig()).then(() => browse(''));
  </script>
</body>
</html>
