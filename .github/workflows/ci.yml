name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall set_app tools tests

      - name: Ruff lint
        run: python -m ruff check --no-cache set_app tools tests

      - name: Pytest
        run: python -m pytest

      - name: Check JavaScript syntax
        run: python -c "import pathlib, subprocess; [subprocess.run(['node', '--check', str(path)], check=True) for path in sorted(pathlib.Path('set_app/static').glob('*.js'))]"

      - name: Check whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha || github.event.before }}"
